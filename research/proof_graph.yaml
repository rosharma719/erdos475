  IRC:
    statement: "Integer Range Conjecture: for finite P,N \u2282 Z_{>0} with \u03A3P=\u03A3N, some signed\
      \ ordering has distinct partial sums and range <= maxP+maxN-1. Implies Graham for every prime (via\
      \ the integer reduction)."
    status: candidate
    depends_on: []
    covers: []
    major: true
    programme: C
    source: ledger
    notes: 1,888,173 instances (values<=18,n<=9); dense cases up to n=60 solved by randomized DFS. Bound
      tight (P=N={5,6}).
    audit:
