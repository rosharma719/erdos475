root: ERDOS475
nodes:
  ERDOS475:
    statement: "Graham/Erd\u0151s #475: for every prime p, every nonempty A \u2286 Z_p\\{0} has an ordering\
      \ with pairwise distinct partial sums."
    status: candidate
    depends_on:
    - LARGE_P_NONEFFECTIVE
    - FINITE_P_LE_37
    - UNIFORM_ALL_P
    covers: []
    major: true
    programme: null
    source: problem.md
    notes: Closes only if the middle range of primes (41 .. non-explicit threshold >= ~e^(10^10)) is covered
      by an explicit, non-asymptotic argument.
    audit:
      referee_accepts: 0
      rounds: []
      human: none
    finite_instances: ''
    history: []
  LARGE_P_NONEFFECTIVE:
    statement: "Conjecture holds for all sufficiently large p (Pham\u2013Sauermann arXiv:2602.15797 with\
      \ Kravitz, Bedert\u2013Kravitz, M\xFCyesser\u2013Pokrovskiy et al.); no numerical threshold in print."
    status: published
    depends_on: []
    covers:
    - all A, p > P0 (P0 not explicit)
    major: false
    programme: B
    source: ledger Status table
    notes: Record exact hypotheses; chain gives P0 >= ~e^(10^10) by an unaudited rough estimate.
    audit:
      referee_accepts: 0
      rounds: []
      human: none
    finite_instances: ''
    history: []
  FINITE_P_LE_37:
    statement: "Exhaustive: every nonempty A \u2286 Z_p\\{0} valid for all primes p <= 37 (Archdeacon\
      \ et al. <=25; Claude p=29,31,37 via orbit enumeration with Burnside-count match)."
    status: finite_verified
    depends_on: []
    covers:
    - all A, p <= 37
    major: false
    programme: null
    source: ledger Verified computations
    notes: p=29,31,37 priority unchecked externally.
    audit:
      referee_accepts: 0
      rounds: []
      human: none
    finite_instances: all nonempty subsets, all primes <= 37
    history: []
  UNIFORM_ALL_P:
    statement: An explicit non-asymptotic argument valid for all primes (or all primes above 37 up to
      the effective threshold).
    status: candidate
