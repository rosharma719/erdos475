root: ERDOS475
nodes:
  ERDOS475:
    statement: 'Graham/Erdős #475: for every prime p, every nonempty A ⊆ Z_p\{0} has an ordering with pairwise distinct
      partial sums.'
    status: candidate
    depends_on:
    - LARGE_P_NONEFFECTIVE
    - FINITE_P_LE_37
    - UNIFORM_ALL_P
    covers: []
    major: true
    programme: null
    source: problem.md
    notes: Closes only if the middle range of primes (41 .. non-explicit threshold >= ~e^(10^10)) is covered by
      an explicit, non-asymptotic argument.
    audit:
      referee_accepts: 0
      rounds: []
      human: none
    finite_instances: ''
    history: []
  LARGE_P_NONEFFECTIVE:
    statement: Conjecture holds for all sufficiently large p (Pham–Sauermann arXiv:2602.15797 with Kravitz, Bedert–Kravitz,
      Müyesser–Pokrovskiy et al.); no numerical threshold in print.
    status: published
    depends_on: []
    covers:
    - all A, p > P0 (P0 not explicit)
    major: false
    programme: B
    source: ledger Status table
    notes: Record exact hypotheses; chain gives P0 >= ~e^(10^10) by an unaudited rough estimate.
    audit:
      referee_accepts: 0
      rounds: []
      human: none
    finite_instances: ''
    history: []
