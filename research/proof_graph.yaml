    notes: 'Exhaustive p<=19 (8,283/8,283 at p=19); dense random p<=23. Equivalent to DFL(1) shifted by one size.
      Obstacle: BALANCE_IDENTITY; local repair fails dense (LOCAL_REPAIR_DENSE).'
    audit:
      referee_accepts: 0
      rounds:
      - 20261122T155310:1
      - 20261122T155310:2
      human: none
    finite_instances: p<=19 exhaustive; dense random p<=23 (ledger)
    history:
    - '-> finite_verified for: p in {7,11,13,17,19,23}, all integer index-1 and index-2 sets (identity dilation),
      all ordered merge pairs; ThmB cases 9324 ThmC cases (H holds) 10418 H-failures (not covered) 30250'
    - referee ACCEPT in 20261122T155310:1
    - '-> finite_verified for: all zero-sum A of size 5 and 6 in Z_p^*, p in {7,11,13,17,19}, all merge pairs; checks
      FP, ''every valid cycle good'' for |A|=5, and bad<=>B1..B4 characterization for |A|=6'
    - referee ACCEPT in 20261122T155310:2
    - 'note (20261122T155310): LSA1 round: proved pieces cover only index<=2 (sparse, k(k+1)/2<=2p) and |A|<=6.
      Open pieces: index-2 non-wrapping pairs with (H) failing (the majority of index-2 cases), index>=3, |A|>=7
      in general, and the dense regime. Neither the balance identity nor the local-repair failure was addressed.'
    - 'status restored to candidate: finite check must not change a universal claim'
    - 'local data (Claude, no API): pure lift-induction Q-closure nonempty for all zero-sum A, 5<=|A|<=p-2, p<=13
      and sizes 5..8 at p=17; every legal pair has a Q-cycle that lifts. See research/data/LSA1.md.'
