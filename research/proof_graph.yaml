    statement: 'FP∀: for every zero-sum A, |A|>=5, and every merge pair with z=a1+a2 ∉ A∪{0}, A''=(A\{a1,a2})∪{z}
      has a valid cycle starting with z whose partial sums miss a1 or a2. Implies Graham for zero-sum sets given
      merge pairs (Dias da Silva–Hamidoune).'
    status: candidate
