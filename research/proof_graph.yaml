    major: true
    programme: A
    source: ledger
    notes: 'OR-routes (not modeled by AND-dependencies): FP_ALL / DFL1 (prog A), IRC (prog C), CN_ALL_K
      (parked). Dependency list shows the primary route only.'
    audit:
      referee_accepts: 0
      rounds: []
      human: none
    finite_instances: ''
    history: []
  FP_ALL:
    statement: "FP\u2200: for every zero-sum A, |A|>=5, and every merge pair with z=a1+a2 \u2209 A\u222A\
      {0}, A'=(A\\{a1,a2})\u222A{z} has a valid cycle starting with z whose partial sums miss a1 or a2.\
      \ Implies Graham for zero-sum sets given merge pairs (Dias da Silva\u2013Hamidoune)."
    status: candidate
    depends_on:
    - LIFT_MERGE_CHAIN
    covers: []
    major: true
    programme: A
    source: 'ledger: free-point round'
    notes: 'Exhaustive p<=19 (8,283/8,283 at p=19); dense random p<=23. Equivalent to DFL(1) shifted by
      one size. Obstacle: BALANCE_IDENTITY; local repair fails dense (LOCAL_REPAIR_DENSE).'
    audit:
      referee_accepts: 0
      rounds: []
      human: none
    finite_instances: 'p<=19 exhaustive; dense random p<=23 (not recorded as finite_verified: no check
      run by this system)'
    history: []
  DFL1:
    statement: "DFL(1): for every zero-sum B, p/2<=|B|<=p-2, x\u2208B, r\u2209{0,x}: a valid cycle starting\
      \ with x misses r. Equivalent to FP\u2200."
    status: candidate
    depends_on:
    - FP_ALL
    covers: []
    major: false
    programme: A
    source: ledger
    notes: 'Exhaustive p<=17 (14,366 tests). Ledger: any threshold-based proof of this cannot finish the
      conjecture; needs non-asymptotic mechanism.'
    audit:
      referee_accepts: 0
      rounds: []
      human: none
    finite_instances: ''
    history: []
  S_PROPERTY:
    statement: "(S): for every zero-sum B, 4<=|B|<=p-3, marked z\u2208B, some simple cycle through edge\
      \ 0->z has no legal pair {h,z-h} in its vertex set (one cycle expands all splits)."
    status: candidate
    depends_on:
    - FP_ALL
    covers: []
    major: false
    programme: A
    source: ledger
    notes: "Exhaustive p<=31 (17,026,322 marked orbit pairs); GPT claims all p for |B|<=6 (unaudited).\
      \ Six-element obstruction B={\xB11,\xB12,\xB13}, z=1 shows small witnesses do not lift."
    audit:
      referee_accepts: 0
      rounds: []
      human: none
    finite_instances: ''
    history: []
  LIFT_MERGE_CHAIN:
    statement: "Merge-chain lift: if y\u2208B\\{x}, z=x+y \u2209 B\u222A{0}\u222AR then Avoid(B,x,R) \u21D0\
      \ Avoid(B',z,R\u222A{x})."
    status: candidate
    depends_on: []
    covers: []
    major: false
    programme: A
    source: ledger
    notes: 'Ledger: proved by Claude 2026-11-22; NOT independently audited by this system.'
    audit:
      referee_accepts: 0
      rounds: []
      human: none
    finite_instances: ''
    history: []
  BALANCE_IDENTITY:
    statement: 'Unwinding the merge chain: level j has |B|=k-j, |R|=j, free residues p-(k-j); slack is
      p-k at every level, so no bounded-|R| hypothesis closes; the maximal ''avoid any R, |R|<=free-1''
      hypothesis is false for small B.'
    status: candidate
    depends_on: []
    covers: []
    major: false
    programme: A
    source: ledger
    notes: 'Ledger: proved by Claude 2026-11-22; NOT independently audited by this system.'
    audit:
      referee_accepts: 0
      rounds: []
      human: none
    finite_instances: ''
    history: []
  PATH_AVOID:
    statement: 'PATH-AVOID(A\S, F): an ordering of A\S with distinct partial sums avoiding |F|=|S|-1 prescribed
      points. Contains Graham (c=0).'
