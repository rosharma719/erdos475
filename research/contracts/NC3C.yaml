goal: 'Statement: for every prime p > 37 and every 3-element C ⊂ F_p^*, A = F_p^* \\ C has an ordering
  with pairwise distinct partial sums (nonzero NOT required; state the convention explicitly when ΣA =
  -ΣC = 0). Primes p <= 37 are covered by FINITE_P_LE_37 (cite as base). Use the TRUE partition: (I) C
  contains an inverse pair {x,-x}; (II) no inverse pair and ΣC = 0; (III) no inverse pair and ΣC != 0.
  (The earlier case split overlapped: C={x,-x,y} fell in two cases.) Attempt (I) first. Check that HOS
  Lemma 4.5 applies to |C|=3 (it may assume |C|<=2) before relying on it; if not, build the case-(I) construction
  by a splitting lift or contraction that avoids it. Beyond p-4, PRIORITISE a scalable local-pattern embedding
  mechanism for complements of size c>3; report separately whether it generalises. Every lemma needs a
  complete proof or a precise missing hypothesis.'
known_inputs:
- contraction
- near_complete
- index_two
principal_gap: 'Ledger ''Contract NC3'': zero-sum C={x,y,-x-y} reduces (proved, unaudited) to four one-parameter
  end-pattern families F1..F4 (bands cover ~[0.15r,0.85r], small/large parameters fail, possibly search
  artefacts); generic non-zero-sum C needs a two-parameter pattern (~half embed at r=12); ± pairs handled
  by HOS Lemma 4.5 (exceptions (d,r) in {(2,4),(2,5),(2,8)}). Need explicit graceful-permutation families
  (Walecki/twizzler type) for all r>=20 plus a selection lemma on dilation/position (the fixed-position
  version is false: 91/228 two-step patterns fail at r=14).'
proof_relevance: 'Extends the known near-complete range by one. A scalable version may enable a theorem
  for growing complements.

  '
approaches:
- Explicit graceful-permutation families realizing F1-F4 (zero-sum C) and the two-end-difference patterns
  (generic C), with a selection lemma over dilations; finite verification covers r<=18.
- 'Top-down: find a valid cycle of a larger explicit dense object (geometric/other R-sequencing) cutting
  into consecutive blocks whose sums are exactly C''s complement, via the contraction lemma.'
allowed_methods:
- analytic_constructions
- combinatorial_arguments
- exact_counterexample_search
excluded_methods:
- lean_formalization
- proof_by_finite_testing
success_condition: 'A complete proof with every case covered, or a rigorous counterexample to the proposed
  intermediate lemma.

  '
obstruction_breaking: 'Documented obstructions: (1) fixed-position/forced-prefix embedding is FALSE (91/228
  two-step patterns fail at r=14); (2) HOS remark that p-4 ''seems unlikely'' by terrace truncation alone;
  (3) zero-sum C cannot be truncated (a c-window never sums to 0). New mechanisms to use: contraction
  of a (c+1)-window whose sum is one of its steps; variable position + dilation freedom; ±-pair special
  window (HOS Lemma 4.5).'
hard_target: All primes r=(p-1)/2 >= 20 and generic (non-±pair) 3-element complements, via an explicit
  family — not just finite verification.
known_regime:
- '|C| <= 2 (published HOS)'
- p <= 37 (exhaustive)
- the ±-pair case via HOS Lemma 4.5 alone
